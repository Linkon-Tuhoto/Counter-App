<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Counter App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <h1>COUNTER APP</h1>
        <h1 class="numb" id="num">0</h1>

        <button class="dec" id="decrease">Decrease</button>
        <button class="res" id="reset">Reset</button>
        <button class="inc" id="increase">Increase</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
